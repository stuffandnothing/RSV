# .gitlab-ci.yml
#
# Builds a custom Void Linux (xbps) repo for x86_64 and x86_64-musl
# entirely inside GitLab CI.
#
# Uses void-linux's own container images (ghcr.io/void-linux/void-*-full)
# and xbps-src's "ethereal" chroot-style, which builds directly inside the
# (disposable) container's own root filesystem instead of unshare()'ing a
# nested chroot. This is required because GitLab.com's shared Docker
# runners run unprivileged and block the unshare(2)/CLONE_NEWUSER syscalls
# that xbps-src's default chroot-style needs - confirmed by testing locally
# (`docker run` without --security-opt seccomp=unconfined reproduces the
# same "failed to unshare from the current namespace" failure GitLab hit).
#
# Two known xbps-src/ethereal quirks worked around in ci-prepare.sh (also
# verified locally, both against the actual void-linux/void-packages HEAD):
#   1. Ethereal requires XBPS_MASTERDIR symlinked to `/`, which makes
#      `cp -f /etc/resolv.conf $XBPS_MASTERDIR/etc` copy the file onto
#      itself - GNU cp errors on that. Patched via sed.
#   2. The void-packages checkout must NOT live at exactly `/void-packages`
#      (that's the literal path ethereal symlinks itself to under
#      XBPS_MASTERDIR=/, so cloning there is a self-referential collision).
#      Cloned into /build/void-packages instead.
#   3. Cross-building via `-A x86_64-musl` does NOT work under ethereal
#      (there's only ever one masterdir = `/`, so the flag is silently
#      ignored). Instead, each arch uses its own native void-*-full image
#      and builds natively - no -A flag.
#
# The prepare/sign logic lives in ci-prepare.sh/ci-sign.sh rather than
# inline here: GitLab's docker-executor script generation doesn't behave
# like a plain `sh -c '...'`, and a heavily-escaped inline sed one-liner
# tried here previously broke shell parsing before any command even ran
# (bare "sh: N: Syntax error" with no line echoed - confirmed by testing
# the exact inline form locally under dash, where it worked fine in
# isolation, meaning the failure was specific to how GitLab assembles the
# job script, not the shell itself). A real script file sidesteps the
# whole class of escaping bugs.
#
# build-images stage: the official void-*-full images ship with no bash at
# all. GitLab's shared-runner docker executor falls back to /bin/sh (dash)
# for bash-less images, and that sh code path is currently broken on
# GitLab.com's shared runners - confirmed directly: a bare `echo hello`
# job on ghcr.io/void-linux/void-glibc-full:latest fails with
# "/usr/bin/sh: 7: Syntax error" with NO script content of ours involved,
# while the identical job on any bash-having image (e.g. debian:bookworm-
# slim) succeeds immediately. So we rebuild the two void-*-full images
# with bash added (Dockerfile.void-glibc-bash / Dockerfile.void-musl-bash)
# and push them to this project's own Container Registry before the build
# jobs run, using the CI-provided registry token - no extra setup needed.
#
# Required CI/CD variables (Settings > CI/CD > Variables, masked+protected):
#   SIGN_PRIVKEY_B64  - base64 of your xbps-rindex private key (privkey.pem)
#   SIGN_NAME         - e.g. "Your Name <you@example.com>"
#
# Generate the key once, locally, on any machine (not the runner).
# xbps-rindex creates the RSA key automatically the first time you sign
# a repo with a --privkey path that doesn't exist yet - so build/index
# any package(s) into a local dir first, then:
#   xbps-rindex -a somerepo/*.xbps
#   xbps-rindex -s somerepo --signedby "Your Name <you@example.com>" --privkey privkey.pem
#   base64 -w0 privkey.pem   -> paste as SIGN_PRIVKEY_B64
#
# A standalone pubkey.pem isn't required - xbps-install fetches the
# public key from the signed repodata automatically on first install.
# The deploy job below also drops one in each arch dir for people who
# prefer to preload it into /var/db/xbps/keys/ manually.
#
# aur job: pushes PKGBUILD to the AUR (aur.archlinux.org/rsv-ng.git)
# whenever PKGBUILD or a shipped file changes on main - it's a VCS/-git
# style AUR package, so payload-only changes don't strictly need a push,
# but are included in the trigger list anyway for consistency with the
# void jobs below. Required CI/CD variable (Settings > CI/CD > Variables,
# masked+protected):
#   AUR_SSH_PRIVATE_KEY_B64 - base64 of the private half of an SSH key
#                             registered to your AUR account (see
#                             ci-aur-push.sh for how to generate one).
#
# void build/deploy jobs: unlike the AUR package, srcpkgs/rsv-ng/template
# is a *pinned snapshot* (xbps-src has no VCS-package concept) - it names
# an exact _commit/version/checksum to fetch. ci-prepare.sh now rewrites
# those three fields to the current $CI_COMMIT_SHA before every build, so
# the Void package always tracks current HEAD instead of staying frozen
# at whatever commit the template last happened to name. GIT_DEPTH is set
# to 0 (full clone) below so `git rev-list --count HEAD`, used for the
# generated version, isn't undercounted by a shallow clone.
#
# Both the aur job and the void build/deploy jobs are gated by `rules:
# changes:` on the files that actually get shipped into a package (see
# PKGBUILD's package() and srcpkgs/rsv-ng/template's do_install()), so
# pushes that don't touch package content (e.g. this file, docs, CI
# scripts) don't trigger pointless rebuilds/republishes.
#
# List the packages you maintain (from void-packages srcpkgs/) here:
variables:
  PACKAGES: "rsv-ng"
  GIT_DEPTH: "0"

stages:
  - build-images
  - build
  - deploy

.installed_files: &installed_files
  - srcpkgs/rsv-ng/template
  - rsv
  - rsv.bash
  - rsv.fish
  - rsv.zsh
  - rsv.1
  - LICENSE
  - README.md

.void_rules: &void_rules
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *installed_files

build-images:
  <<: *void_rules
  stage: build-images
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --pull -t "$CI_REGISTRY_IMAGE/void-glibc-bash:latest" -f Dockerfile.void-glibc-bash .
    - docker push "$CI_REGISTRY_IMAGE/void-glibc-bash:latest"
    - docker build --pull -t "$CI_REGISTRY_IMAGE/void-musl-bash:latest" -f Dockerfile.void-musl-bash .
    - docker push "$CI_REGISTRY_IMAGE/void-musl-bash:latest"

.build_template: &build_template
  stage: build
  needs:
    - build-images
  before_script:
    - sh "$CI_PROJECT_DIR"/ci-prepare.sh
    - cd /build/void-packages
    - export XBPS_CHROOT_CMD=ethereal
    - export XBPS_ALLOW_CHROOT_BREAKOUT=yes
  artifacts:
    paths:
      - public/
    expire_in: 1 hour

build:x86_64:
  <<: [*build_template, *void_rules]
  image: $CI_REGISTRY_IMAGE/void-glibc-bash:latest
  script:
    - for pkg in $PACKAGES; do ./xbps-src pkg "$pkg"; done
    - mkdir -p "$CI_PROJECT_DIR/public/x86_64"
    - cp hostdir/binpkgs/*.x86_64.xbps "$CI_PROJECT_DIR/public/x86_64/" 2>/dev/null || true

build:x86_64-musl:
  <<: [*build_template, *void_rules]
  image: $CI_REGISTRY_IMAGE/void-musl-bash:latest
  script:
    - for pkg in $PACKAGES; do ./xbps-src pkg "$pkg"; done
    - mkdir -p "$CI_PROJECT_DIR/public/x86_64-musl"
    - cp hostdir/binpkgs/*.x86_64-musl.xbps "$CI_PROJECT_DIR/public/x86_64-musl/" 2>/dev/null || true

index_sign_deploy:
  <<: *void_rules
  stage: deploy
  image: debian:bookworm-slim
  needs:
    - build:x86_64
    - build:x86_64-musl
  before_script:
    # grab static xbps tools (xbps-rindex) instead of any Void image -
    # always current, since it's the same binaries xbps-src itself uses
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates xz-utils openssl
    - curl -LO https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
    - mkdir -p /tmp/xbps-static && tar -xf xbps-static-latest.x86_64-musl.tar.xz -C /tmp/xbps-static
    - export PATH="/tmp/xbps-static/usr/bin:$PATH"
  script:
    - sh "$CI_PROJECT_DIR"/ci-sign.sh
  artifacts:
    paths:
      - public/

pages:
  <<: *void_rules
  stage: deploy
  needs:
    - index_sign_deploy
  script:
    - sh "$CI_PROJECT_DIR"/gen-index.sh
    - echo "Publishing to GitLab Pages"
  artifacts:
    paths:
      - public

aur:
  stage: deploy
  image: archlinux:base
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - PKGBUILD
        - rsv
        - rsv.bash
        - rsv.fish
        - rsv.zsh
        - rsv.1
        - LICENSE
        - README.md
  before_script:
    - pacman -Syu --noconfirm --needed base-devel git openssh shadow
  script:
    - sh "$CI_PROJECT_DIR"/ci-aur-push.sh
